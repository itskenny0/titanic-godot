name: Package Linux formats
on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
      artifact_run:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  linux-formats:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x86_64, appimage_arch: x86_64}
          - {runner: ubuntu-24.04-arm, arch: arm64, appimage_arch: aarch64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/download-artifact@v4
        with:
          name: game-packs-and-source
          path: dist
          run-id: ${{ inputs.artifact_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: titanic-linux-${{ matrix.arch }}
          path: dist
          run-id: ${{ inputs.artifact_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Prepare shared application payload
        run: |
          mkdir -p .build/linux-payload
          tar -xzf dist/titanic-linux-${{ matrix.arch }}.tar.gz -C .build/linux-payload
          cp -r .build/linux-payload/titanic packaging/linux/flatpak-input
          cp packaging/linux/io.github.itskenny0.Titanic.{desktop,png,metainfo.xml} packaging/linux/flatpak-input/
          if [[ -f packaging/linux/io.github.itskenny0.Titanic.256.png ]]; then
            cp packaging/linux/io.github.itskenny0.Titanic.256.png packaging/linux/flatpak-input/
          fi
          # shellcheck disable=SC2016
          printf '#!/bin/sh\nexec /app/lib/titanic/titanic --main-pack /app/lib/titanic/titanic.pck "$@"\n' > packaging/linux/flatpak-input/launcher
      - name: Build offline Flatpak bundle
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder python3-pil
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --build-only --force-clean .build/flatpak-build packaging/linux/io.github.itskenny0.Titanic.yml
          # Standard theme sizes are required by desktop menus and AppStream.
          # Repackage the existing deb too, so older tagged builds get the fix.
          dpkg-deb --raw-extract dist/titanic-linux-${{ matrix.arch }}.deb .build/deb-icons
          python3 - <<'PYICON'
          from pathlib import Path
          from PIL import Image
          icon = Image.open('packaging/linux/io.github.itskenny0.Titanic.png')
          roots = [Path('.build/flatpak-build/files/share/icons/hicolor'), Path('.build/deb-icons/usr/share/icons/hicolor')]
          for root in roots:
              for size in (64, 128, 256):
                  dest = root / f'{size}x{size}' / 'apps/io.github.itskenny0.Titanic.png'
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  icon.resize((size, size), Image.Resampling.LANCZOS).save(dest)
              # Flatpak refuses exported icons larger than 512 pixels.
              (root / '1024x1024/apps/io.github.itskenny0.Titanic.png').unlink(missing_ok=True)
          PYICON
          dpkg-deb --root-owner-group --build .build/deb-icons dist/titanic-linux-${{ matrix.arch }}.deb
          flatpak-builder --user --finish-only --disable-cache --repo=.build/flatpak-repo .build/flatpak-build packaging/linux/io.github.itskenny0.Titanic.yml
          flatpak build-bundle .build/flatpak-repo dist/titanic-linux-${{ matrix.arch }}.flatpak io.github.itskenny0.Titanic
      - name: Build AppImage
        env:
          ARCH: ${{ matrix.appimage_arch }}
        run: |
          mkdir -p .build/AppDir/usr/lib/titanic .build/AppDir/usr/bin
          cp -r .build/linux-payload/titanic/. .build/AppDir/usr/lib/titanic/
          cp packaging/linux/io.github.itskenny0.Titanic.{desktop,png} .build/AppDir/
          # shellcheck disable=SC2016
          printf '#!/bin/sh\nAPPDIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)\nexec "$APPDIR/usr/lib/titanic/titanic" --main-pack "$APPDIR/usr/lib/titanic/titanic.pck" "$@"\n' > .build/AppDir/AppRun
          chmod +x .build/AppDir/AppRun
          curl -fL "https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-$ARCH.AppImage" -o .build/appimagetool
          chmod +x .build/appimagetool
          .build/appimagetool --appimage-extract-and-run .build/AppDir dist/titanic-linux-${{ matrix.arch }}.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: titanic-linux-formats-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.flatpak
            dist/*.AppImage
          if-no-files-found: error

