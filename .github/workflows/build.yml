name: Build Mac player

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-runtime:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Build without game files or saved games
        run: scripts/build-restored-app.sh --runtime-only
      - name: Verify public bundle and corresponding source
        run: scripts/verify-restored-app.py --runtime-only dist/public/Titanic.app
      - name: Test authored save format and recovery
        run: vendor/dreamrefactory/node_modules/.bin/vitest run --config native/restoration/Web/vitest.config.ts
      - name: Typecheck the game host
        run: vendor/dreamrefactory/node_modules/.bin/tsc -p native/restoration/Web/tsconfig.json
      - name: Test local game-data preparation
        run: python3 -m unittest discover -s scripts/tests -v
