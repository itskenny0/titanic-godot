name: Build Godot players
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and attach downloads to (blank builds this ref only)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: build-${{ github.event_name }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  GODOT_SILENCE_ROOT_WARNING: '1'
  LP_NUM_THREADS: '2'

jobs:
  pack:
    # Dirty releases are packaged and uploaded manually. Every build needs pack.
    if: github.event_name != 'release' || (!contains(github.event.release.tag_name, 'dirty') && !contains(github.event.release.name, 'dirty'))
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - name: Record source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false
      - run: python3 tools/prepare-notices.py
      - name: Install Godot pack exporters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libasound2 libgl1
          mkdir -p .tools
          curl --retry 5 --retry-delay 3 --retry-max-time 180 -fL https://github.com/godotengine/godot/releases/download/3.5.2-stable/Godot_v3.5.2-stable_x11.64.zip -o .tools/godot3.zip
          unzip -q .tools/godot3.zip -d .tools
          curl --retry 5 --retry-delay 3 --retry-max-time 180 -fL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o .tools/godot4.zip
          unzip -q .tools/godot4.zip -d .tools
      - name: Export both frontends
        run: |
          xvfb-run -a python3 tools/export-pack.py --godot "$PWD/.tools/Godot_v3.5.2-stable_x11.64" --output dist/titanic.pck
          python3 tools/prepare-godot4.py --godot "$PWD/.tools/Godot_v4.3-stable_linux.x86_64"
          python3 tools/export-pack.py --godot "$PWD/.tools/Godot_v4.3-stable_linux.x86_64" --project .build/godot4-project --major 4 --output dist/titanic4.pck
      - name: Check the native bridge without game data
        run: |
          go test -race ./internal/... ./cmd/native-codecs ./cmd/personal-build
          python3 tools/build-go.py --platform linux --arch x86_64
          cmake -S native -B .build/native -DCMAKE_BUILD_TYPE=Release -DTITANIC_GO_LIBRARY="$PWD/.build/go/linux-x86_64/libtitanic_go.a"
          cmake --build .build/native --target titanic -j2
          cp .build/native/libtitanic.so godot/native/libtitanic.x86_64.so
          python3 tests/native-player.py .build/native/libtitanic.so
          cp tests/runtime.gd godot/runtime-test.gd
          timeout 60 xvfb-run -a .tools/Godot_v3.5.2-stable_x11.64 --path godot --audio-driver Dummy -s res://runtime-test.gd | tee .build/portable.log
          grep -q 'PORTABLE TESTS PASS' .build/portable.log
      - name: Check PortMaster launcher
        run: python3 tests/portmaster-launcher.py
      - name: Check digital and original disc layouts
        run: |
          cp tests/game_files.gd godot/game-files-test.gd
          timeout 45 xvfb-run -a .tools/Godot_v3.5.2-stable_x11.64 --path godot --audio-driver Dummy -s res://game-files-test.gd
          xvfb-run -a python3 tools/test-godot4.py --godot "$PWD/.tools/Godot_v4.3-stable_linux.x86_64" --test game_files
          cp tests/window_close.gd godot/window-close-test.gd
          timeout 45 xvfb-run -a .tools/Godot_v3.5.2-stable_x11.64 --path godot --audio-driver Dummy -s res://window-close-test.gd -- --ui-test
          xvfb-run -a python3 tools/test-godot4.py --godot "$PWD/.tools/Godot_v4.3-stable_linux.x86_64" --test window_close
      - name: Check handheld and touch layouts
        run: |
          cp tests/ui.gd godot/ui-test.gd
          cp tests/controls.gd godot/controls-test.gd
          cp tests/controller.gd godot/controller-test.gd
          cp tests/patches.gd godot/patches-test.gd
          timeout 45 xvfb-run -a .tools/Godot_v3.5.2-stable_x11.64 --path godot --audio-driver Dummy --resolution 640x480 -s res://patches-test.gd -- --ui-test
          xvfb-run -a python3 tools/test-godot4.py --godot "$PWD/.tools/Godot_v4.3-stable_linux.x86_64" --test patches --resolution 640x480
          timeout 45 xvfb-run -a .tools/Godot_v3.5.2-stable_x11.64 --path godot --audio-driver Dummy --resolution 640x480 -s res://ui-test.gd -- --ui-test
          timeout 45 xvfb-run -a .tools/Godot_v3.5.2-stable_x11.64 --path godot --audio-driver Dummy --resolution 480x800 -s res://controls-test.gd -- --ui-test --touch-test
          timeout 45 xvfb-run -a .tools/Godot_v3.5.2-stable_x11.64 --path godot --audio-driver Dummy --resolution 1280x960 -s res://controller-test.gd -- --ui-test
          if [[ -f tests/idle.gd ]]; then
            cp tests/idle.gd godot/idle-test.gd
            timeout 30 xvfb-run -a .tools/Godot_v3.5.2-stable_x11.64 --path godot --audio-driver Dummy --resolution 640x480 -s res://idle-test.gd -- --ui-test
            xvfb-run -a python3 tools/test-godot4.py --godot "$PWD/.tools/Godot_v4.3-stable_linux.x86_64" --test idle --resolution 640x480
          fi
          xvfb-run -a python3 tools/test-godot4.py --godot "$PWD/.tools/Godot_v4.3-stable_linux.x86_64" --test controller --resolution 1280x960
          xvfb-run -a python3 tools/test-godot4.py --godot "$PWD/.tools/Godot_v4.3-stable_linux.x86_64" --test ui --resolution 480x800 --touch
          cp tests/rotation4.gd .build/godot4-project/rotation-test.gd
          xvfb-run -a .tools/Godot_v4.3-stable_linux.x86_64 --path .build/godot4-project --audio-driver Dummy -s res://rotation-test.gd -- --ui-test --touch-test
          rm .build/godot4-project/rotation-test.gd
      - run: python3 tools/source-archive.py
      - uses: actions/upload-artifact@v4
        with:
          name: game-packs-and-source
          path: dist/*
          if-no-files-found: error

  desktop:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, platform: linux, arch: x86_64}
          - {runner: ubuntu-24.04-arm, platform: linux, arch: arm64}
          - {runner: macos-14, platform: mac, arch: x86_64}
          - {runner: macos-14, platform: mac, arch: arm64}
          - {runner: ubuntu-22.04, platform: windows, arch: x86_64}
          - {runner: ubuntu-22.04, platform: windows, arch: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install scons==4.8.1
      - name: Check ARM64 gameplay and reference rounding
        if: matrix.platform == 'linux' && matrix.arch == 'arm64'
        run: go test ./internal/... ./cmd/native-codecs
      - uses: actions/download-artifact@v4
        with:
          name: game-packs-and-source
          path: dist
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential pkg-config libx11-dev libxcursor-dev libxinerama-dev libxrandr-dev libxi-dev libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev xvfb
      - name: Install LLVM MinGW cross compiler
        if: matrix.platform == 'windows'
        run: |
          mkdir -p .tools
          curl -fL https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz -o .tools/mingw.tar.xz
          tar -xf .tools/mingw.tar.xz -C .tools
          echo "$PWD/.tools/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64/bin" >> "$GITHUB_PATH"
      - name: Compile runtime
        shell: bash
        run: |
          extra=()
          if [[ '${{ matrix.platform }}' == windows ]]; then
            prefix=x86_64-w64-mingw32-
            [[ '${{ matrix.arch }}' != arm64 ]] || prefix=aarch64-w64-mingw32-
            extra=(--mingw-prefix "$prefix")
            # Older tags did not select LLVM and looked for a nonexistent gcc-ar.
            mkdir -p .tools/llvm-scons
            printf '#!/bin/sh\nexec "%s" "$@" use_llvm=yes\n' "$(command -v scons)" > .tools/llvm-scons/scons
            chmod +x .tools/llvm-scons/scons
            export PATH="$PWD/.tools/llvm-scons:$PATH"
          fi
          python3 tools/build-runtime.py --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}' --jobs 3 "${extra[@]}"
      - name: Check binary architecture
        if: runner.os == 'Linux'
        run: |
          file dist/runtime-*
          if [[ '${{ matrix.platform }}' == windows && '${{ matrix.arch }}' == arm64 ]]; then
            file dist/runtime-windows-arm64.exe | grep -q 'Aarch64'
          fi
      - name: Package player
        shell: bash
        run: |
          binary='dist/runtime-${{ matrix.platform }}-${{ matrix.arch }}'
          pack=dist/titanic.pck
          [[ '${{ matrix.platform }}' != windows ]] || binary="$binary.exe"
          if [[ '${{ matrix.platform }}' == windows && '${{ matrix.arch }}' == arm64 ]]; then pack=dist/titanic4.pck; fi
          python3 tools/package.py '${{ matrix.platform }}' --arch '${{ matrix.arch }}' --binary "$binary" --pack "$pack"
          if [[ '${{ matrix.platform }}' == linux ]]; then
            python3 tools/package.py linux --arch '${{ matrix.arch }}' --binary "$binary" --pack "$pack" --static
          fi
      - name: Linux startup test
        if: matrix.platform == 'linux'
        run: |
          timeout 30 xvfb-run -a dist/runtime-linux-${{ matrix.arch }} --main-pack dist/titanic.pck --audio-driver Dummy --quit 2>&1 | tee .build/startup.log
          if grep -E 'SCRIPT ERROR|Parse Error' .build/startup.log; then exit 1; fi
          timeout 45 xvfb-run -a dist/runtime-linux-${{ matrix.arch }} --main-pack dist/titanic.pck --audio-driver Dummy -s "$PWD/tests/runtime.gd" | tee .build/module-test.log
          grep -q 'PORTABLE TESTS PASS' .build/module-test.log
      - uses: actions/upload-artifact@v4
        with:
          name: titanic-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/titanic-*.zip
            dist/titanic-linux-*.deb
            dist/titanic-linux-*.tar.gz
            dist/runtime-*
          if-no-files-found: error

  portmaster:
    needs: pack
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: game-packs-and-source
          path: dist
      - name: Compile bridges against glibc 2.31 for handheld firmware
        run: |
          mkdir -p .build
          docker run --rm -v "$PWD:/work" -v "$(go env GOROOT):/opt/go:ro" -e GOROOT=/opt/go -e PATH=/opt/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin -w /work ubuntu:20.04 bash -eu -c '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y cmake gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf make python3
            for spec in aarch64:aarch64-linux-gnu-gcc armhf:arm-linux-gnueabihf-gcc; do
              arch="${spec%%:*}"
              cc="${spec#*:}"
              goarch="$arch"
              [[ "$arch" != aarch64 ]] || goarch=arm64
              python3 tools/build-go.py --platform linux --arch "$goarch" --cc "$cc"
              cmake -S native -B ".build/$arch" -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_C_COMPILER="$cc" -DCMAKE_BUILD_TYPE=Release -DTITANIC_GO_LIBRARY="/work/.build/go/linux-$goarch/libtitanic_go.a"
              cmake --build ".build/$arch" --target titanic -j2
              cp ".build/$arch/libtitanic.so" "godot/native/libtitanic.$arch.so"
            done'
          bash -n packaging/portmaster/Titanic.sh
          python3 tools/package.py portmaster
      - uses: actions/upload-artifact@v4
        with:
          name: titanic-portmaster
          path: dist/titanic-portmaster.zip
          if-no-files-found: error

  linux-formats:
    needs: [desktop, pack]
    uses: ./.github/workflows/linux-formats.yml
    permissions:
      contents: read
      actions: read
    with:
      source_ref: ${{ needs.pack.outputs.source_sha }}

  android:
    needs: pack
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: |
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.1.10909125'
          pip install scons==4.8.1
          python3 tools/prepare-notices.py
          python3 tools/fetch-godot.py 4 .build/godot4
          python3 tools/build-go.py --platform android --arch arm64
          python3 tools/install-module.py .build/godot4 --go-library .build/go/android-arm64/libtitanic_go.so
          python3 tools/prepare-android.py
      - name: Build ARM64 Android engine and document picker
        run: |
          python3 tools/build-android.py --jobs 3
      - name: Export touchscreen and controller APK
        run: |
          mkdir -p .tools dist
          curl -fL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o .tools/godot4.zip
          unzip -q .tools/godot4.zip -d .tools
          python3 tools/prepare-godot4.py --godot "$PWD/.tools/Godot_v4.3-stable_linux.x86_64"
          XDG_CONFIG_HOME="$PWD/.build/android-editor-settings" python3 tools/export-android.py --release --godot "$PWD/.tools/Godot_v4.3-stable_linux.x86_64" --sdk "$ANDROID_HOME"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify dist/titanic-android-arm64-release.apk
          python3 tools/verify-android.py dist/titanic-android-arm64-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: titanic-android-arm64
          path: dist/titanic-android-arm64-release.apk
          if-no-files-found: error

  release:
    needs: [pack, desktop, portmaster, linux-formats, android]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/download-artifact@v4
        with:
          path: .build/release-artifacts
      - run: python3 tests/release-assets.py
      - name: Attach verified packages and checksums to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          SOURCE_SHA: ${{ needs.pack.outputs.source_sha }}
        run: python3 tools/release-assets.py .build/release-artifacts --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA"
